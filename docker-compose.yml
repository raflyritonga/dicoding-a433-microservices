version: '3'

services:
  # Node.js + Express app
  item-app:
    image: ghcr.io/raflyritonga/item-app:v1
    restart: always
    ports:
      - "80:8080"
    depends_on:
      - item-db

  # MongoDB
  item-db:
    image: mongo:3
    restart: always
    # Persist data outside the container lifecycle
    volumes:
      - app-db:/data/db

volumes:
  app-db:
