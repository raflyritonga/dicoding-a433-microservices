# Deployment for order service publisher
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: e-commerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          # Pull image from GitHub Container Registry
          image: ghcr.io/raflyritonga/order-service:latest
          # Always pull latest image on pod restart
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            # Service port matching Dockerfile EXPOSE
            - name: PORT
              value: "3000"
            # AMQP URL uses rabbitmq service DNS within same namespace
            - name: AMQP_URL
              value: "amqp://rabbitmq:5672"
